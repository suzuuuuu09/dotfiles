name: 'Bot: Renovate'

on:
  workflow_dispatch:
  schedule:
    - cron:  '17 0 * * *'
      timezone: 'Asia/Tokyo'
  push:
    branches:
      - main

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SUZUUUUU09_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.SUZUUUUU09_RENOVATE_PRIVATE_KEY }}

          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
          
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          skipPush: 'true'
      - name: Run Renovate
        run: nix shell --inputs-from . nixpkgs#renovate nixpkgs#npins nixpkgs#jq -c renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/renovate-agent-sources[.]sh$"]'
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: 'suzuuuuu09/dotfiles'
          NODE_OPTIONS: '--max-old-space-size=4096'
