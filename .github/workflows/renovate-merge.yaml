name: 'Bot: Merge Renovate PR'

on:
  # Only trusted base-branch steps run; PR code is never checked out or executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

concurrency:
  group: renovate-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  manage-auto-merge:
    # Keep label decisions in the handler so removal events cannot be filtered out.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SUZUUUUU09_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.SUZUUUUU09_RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Apply merge authorization
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/merge-authorization.sh
