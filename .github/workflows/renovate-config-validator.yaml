name: "CI: Renovate config lint"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - .github/renovate.jsonc
      - .github/workflows/renovate.yaml
      - .github/actions/setup-nix/action.yaml
      - scripts/renovate-agent-sources.sh
      - scripts/test_renovate_agent_sources.py
  workflow_call:

concurrency:
  group: renovate-config-validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate-validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Renovate config for validator
        run: cp .github/renovate.jsonc "$RUNNER_TEMP/renovate.json5"
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          config_file_path: ${{ runner.temp }}/renovate.json5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          skipPush: 'true'
      - name: Test source lock refresh
        run: nix shell --inputs-from . nixpkgs#python3 nixpkgs#jq -c python3 scripts/test_renovate_agent_sources.py
