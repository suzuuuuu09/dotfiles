name: "CI: Renovate config lint"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - .github/renovate.jsonc
  pull_request:
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - .github/renovate.jsonc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate-validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Renovate config for validator
        run: cp .github/renovate.jsonc "$RUNNER_TEMP/renovate.json5"
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@394f7a3d2641cad2995938f9dc7e54580c8a7089 # v2.3.0
        with:
          config_file_path: ${{ runner.temp }}/renovate.json5
